<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} by {{ seller_name }} - अन्नData</title>
    <!-- Using Tailwind to match your main app style -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #fafaf9; }
    </style>
</head>
<body class="text-slate-900">

    <!-- Header (Matching index.html) -->
    <header class="bg-white border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-6">
            <a href="/" class="flex items-center gap-4 shrink-0 text-stone-900 no-underline">
                <i class="fa-solid fa-bars text-lg text-stone-700 cursor-pointer"></i>
                <span class="text-xl font-bold tracking-tight">अन्नData</span>
            </a>
            <div class="flex items-center gap-5 shrink-0">
                <i class="fa-solid fa-cart-shopping text-lg text-stone-700 cursor-pointer"></i>
                <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=100&q=80"
                    class="h-10 w-10 rounded-full object-cover border border-stone-200">
            </div>
        </div>
    </header>

    <!-- Main Content Layout (Directly on background, no card wrap) -->
    <main class="max-w-6xl mx-auto px-6 py-10">
        
        <!-- Breadcrumbs -->
        <div class="text-sm text-stone-500 mb-8">
            <a href="/" class="hover:text-emerald-700">Home</a> / {{ product.category_rel.name if product.category_rel else "Category" }} / <span class="text-stone-800">{{ product.name }}</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 lg:gap-20">
            
            <!-- Left Side: Image -->
            <div class="relative">
                <img src="{{ product.image }}" alt="{{ product.name }}" class="w-full h-auto rounded-3xl object-cover shadow-sm aspect-square">
                
                {% if product.favorable %}
                <span class="absolute top-5 right-5 bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded uppercase tracking-wide">
                    Organic / Favorable
                </span>
                {% endif %}
            </div>

            <!-- Right Side: Details -->
            <div class="flex flex-col justify-center">
                
                <h1 class="text-4xl md:text-5xl font-extrabold text-stone-900 tracking-tight">{{ product.name }}</h1>
                
                <!-- Added Seller Name exactly as requested -->
                <p class="text-lg text-stone-500 mt-2 font-medium">Seller: <span class="text-stone-800">{{ seller_name }}</span></p>

                <div class="flex items-center gap-2 mt-4">
                    <div class="text-amber-400 text-lg tracking-widest">★★★★★</div>
                    <span class="text-sm text-stone-500 font-medium ml-2">5.0 (112 orders)</span>
                </div>

                <div class="mt-8 flex items-baseline gap-2">
                    <!-- Currently showing the farmer's hardcoded price from the previous page -->
                    <span class="text-4xl font-bold text-emerald-700">₹50</span>
                    <span class="text-lg text-stone-400 font-medium line-through ml-2">₹65</span>
                    <span class="text-xl text-stone-600 ml-1">/ {{ product.unit }}</span>
                </div>

                <!-- Action Area (Quantity + Buttons) -->
                <div class="mt-10 flex flex-col sm:flex-row items-center gap-4">
                    
                    <!-- Quantity Selector -->
                    <div class="flex items-center border-2 border-stone-200 rounded-full bg-white h-12 px-2 shrink-0">
                        <button class="w-10 h-full flex items-center justify-center text-stone-400 hover:text-stone-800 transition text-xl font-medium">-</button>
                        <span class="w-10 text-center font-bold text-stone-800">1</span>
                        <button class="w-10 h-full flex items-center justify-center text-stone-400 hover:text-stone-800 transition text-xl font-medium">+</button>
                    </div>

                    <!-- Add to Cart & Buy Now Option -->
                    <div class="flex flex-1 gap-3 w-full">
                        <button class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold h-12 rounded-full transition flex items-center justify-center gap-2 shadow-md shadow-emerald-200">
                            <i class="fa-solid fa-cart-shopping"></i> Add to Basket
                        </button>
                        <button class="flex-1 bg-stone-900 hover:bg-black text-white font-bold h-12 rounded-full transition shadow-md">
                            Buy Now
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
